<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography Quest: India</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            overflow-x: hidden;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .pulse-glow {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); /* Emerald glow for Geography */
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.8); }
            100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Canvas for confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Game specific styles */
        .map-region {
            transition: all 0.3s ease;
            cursor: pointer;
            fill: #334155;
            stroke: #cbd5e1;
            stroke-width: 1;
        }
        .map-region:hover {
            fill: #10b981; /* Emerald 500 */
        }
        .map-region.selected {
            fill: #059669; /* Emerald 600 */
        }
        .map-region.correct {
            fill: #10b981;
            stroke: #fff;
            stroke-width: 2;
        }
        .map-region.incorrect {
            fill: #ef4444; /* Red 500 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    <canvas id="confetti-canvas"></canvas>

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-40 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="bg-emerald-500 text-slate-900 p-2 rounded-lg font-bold text-xl">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-500">Geography Quest</h1>
                <p class="text-xs text-slate-400 font-medium">UPSC / WBCS Prep - Indian Geography</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-full flex items-center gap-2 shadow-inner">
                <i class="fa-solid fa-star text-emerald-400"></i>
                <span id="global-score" class="font-bold text-lg">0</span>
                <span class="text-xs text-slate-400 hidden sm:inline">XP</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 py-8 relative z-10 w-full max-w-5xl">
        
        <!-- Dashboard / Menu View -->
        <div id="menu-view" class="fade-in">
            <div class="text-center mb-10">
                <h2 class="text-3xl md:text-4xl font-extrabold mb-4">Master Indian Geography</h2>
                <p class="text-slate-400 max-w-2xl mx-auto">Engage with interactive mini-games designed to reinforce map locations, river systems, and geographical facts. Perfect for quick revisions.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Game 1 Card -->
                <button onclick="startGame('mapMaster')" class="group text-left glass-panel rounded-2xl p-6 transition-all duration-300 hover:scale-105 hover:border-emerald-500/50 hover:shadow-[0_0_20px_rgba(16,185,129,0.2)]">
                    <div class="bg-blue-500/20 text-blue-400 w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2 text-slate-100">Map Master: States</h3>
                    <p class="text-sm text-slate-400 mb-4">Identify Indian states on a blank map. Tests your spatial awareness and location memory.</p>
                    <div class="flex items-center text-emerald-400 text-sm font-semibold">
                        <span>Play Now</span> <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </button>

                <!-- Game 2 Card -->
                <button onclick="startGame('riverSystem')" class="group text-left glass-panel rounded-2xl p-6 transition-all duration-300 hover:scale-105 hover:border-emerald-500/50 hover:shadow-[0_0_20px_rgba(16,185,129,0.2)]">
                    <div class="bg-cyan-500/20 text-cyan-400 w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-cyan-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-water"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2 text-slate-100">River Systems</h3>
                    <p class="text-sm text-slate-400 mb-4">Match tributaries to their main rivers or identify origins. Crucial for drainage system prep.</p>
                    <div class="flex items-center text-emerald-400 text-sm font-semibold">
                        <span>Play Now</span> <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </button>

                <!-- Game 3 Card -->
                <button onclick="startGame('factCheck')" class="group text-left glass-panel rounded-2xl p-6 transition-all duration-300 hover:scale-105 hover:border-emerald-500/50 hover:shadow-[0_0_20px_rgba(16,185,129,0.2)]">
                    <div class="bg-orange-500/20 text-orange-400 w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:bg-orange-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-mountain-sun"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2 text-slate-100">Geo Fact Check</h3>
                    <p class="text-sm text-slate-400 mb-4">Rapid-fire True/False questions covering climate, soils, vegetation, and physical features.</p>
                    <div class="flex items-center text-emerald-400 text-sm font-semibold">
                        <span>Play Now</span> <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </button>
            </div>
        </div>

        <!-- Game Container (Hidden by default) -->
        <div id="game-view" class="hidden fade-in">
            <div class="flex justify-between items-center mb-6">
                <button onclick="returnToMenu()" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Back to Menu
                </button>
                <div id="game-title" class="text-xl font-bold text-emerald-400">Game Title</div>
                <div id="game-score-tracker" class="bg-slate-800 px-3 py-1 rounded-md text-sm font-semibold border border-slate-700">Score: 0</div>
            </div>
            
            <!-- Dynamic Game Canvas where JS will inject UI -->
            <div id="game-canvas" class="glass-panel rounded-2xl p-6 md:p-8 min-h-[400px] flex flex-col items-center justify-center">
                <!-- Content injected here -->
            </div>
        </div>
    </main>

    <!-- Custom Modal for Alerts/Feedback -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center px-4 bg-slate-900/80 backdrop-blur-sm">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl transform scale-95 opacity-0 transition-all duration-300" id="modal-content">
            <div class="text-center">
                <div id="modal-icon" class="text-4xl mb-4 mx-auto w-16 h-16 flex items-center justify-center rounded-full bg-slate-700">
                    <!-- Icon injected here -->
                </div>
                <h3 id="modal-title" class="text-2xl font-bold mb-2 text-white">Title</h3>
                <p id="modal-message" class="text-slate-300 mb-6">Message goes here.</p>
                <button onclick="closeModal()" id="modal-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-3 rounded-xl transition-colors">
                    Continue
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA STRUCTURES ---

        // Simplified coordinates/paths for a representative abstract map game.
        // In a real app, this would be a full SVG path set for India.
        const mapData = [
            { id: "jk", name: "Jammu & Kashmir / Ladakh", shape: "M 50 20 L 70 20 L 80 40 L 60 50 Z" },
            { id: "rj", name: "Rajasthan", shape: "M 20 60 L 45 50 L 50 80 L 25 90 Z" },
            { id: "gj", name: "Gujarat", shape: "M 10 90 L 30 85 L 35 110 L 15 110 Z" },
            { id: "mh", name: "Maharashtra", shape: "M 35 110 L 60 100 L 65 130 L 40 140 Z" },
            { id: "mp", name: "Madhya Pradesh", shape: "M 50 80 L 80 75 L 85 105 L 60 100 Z" },
            { id: "up", name: "Uttar Pradesh", shape: "M 60 50 L 90 60 L 80 75 L 50 80 Z" },
            { id: "kl", name: "Kerala", shape: "M 45 160 L 55 160 L 60 190 L 50 190 Z" },
            { id: "tn", name: "Tamil Nadu", shape: "M 55 160 L 75 150 L 70 185 L 60 190 Z" },
            { id: "wb", name: "West Bengal", shape: "M 95 85 L 105 80 L 110 100 L 100 110 Z" },
            { id: "as", name: "Assam", shape: "M 110 70 L 140 70 L 135 85 L 110 85 Z" }
        ];

        const riverData = [
            { main: "Ganga", tributary: "Yamuna", origin: "Gangotri Glacier", fact: "Longest river of India." },
            { main: "Ganga", tributary: "Kosi", origin: "Himalayas", fact: "Known as the Sorrow of Bihar." },
            { main: "Indus", tributary: "Sutlej", origin: "Rakshastal (Tibet)", fact: "Forms the Bhakra Nangal Dam." },
            { main: "Indus", tributary: "Chenab", origin: "Bara Lacha Pass", fact: "Largest tributary of the Indus." },
            { main: "Godavari", tributary: "Indravati", origin: "Trimbakeshwar", fact: "Known as Dakshin Ganga." },
            { main: "Krishna", tributary: "Tungabhadra", origin: "Mahabaleshwar", fact: "Flows through Maharashtra, Karnataka, Telangana and Andhra." },
            { main: "Cauvery", tributary: "Kabini", origin: "Talakaveri (Brahmagiri)", fact: "Known as the Ganga of the South." },
            { main: "Narmada", tributary: "Tawa", origin: "Amarkantak", fact: "Flows in a rift valley between Vindhya and Satpura." },
            { main: "Brahmaputra", tributary: "Teesta", origin: "Chemayungdung Glacier", fact: "Known as Tsangpo in Tibet." }
        ];

        const geoFactsData = [
            { statement: "The Tropic of Cancer passes through 8 Indian states.", isTrue: true, explanation: "It passes through Gujarat, Rajasthan, MP, Chhattisgarh, Jharkhand, West Bengal, Tripura, and Mizoram." },
            { statement: "Black soil (Regur) is best suited for cultivating tea and coffee.", isTrue: false, explanation: "Black soil is best suited for Cotton. Laterite soil is better for tea/coffee." },
            { statement: "The Western Ghats are taller and more continuous than the Eastern Ghats.", isTrue: true, explanation: "Western Ghats have an average elevation of 900-1600m and are continuous, crossed only through passes." },
            { statement: "Mawsynram in Meghalaya receives the highest average annual rainfall in the world.", isTrue: true, explanation: "Located in the Khasi Hills, it receives immense rainfall due to its funnel-shaped topography." },
            { statement: "The Andaman and Nicobar Islands are separated by the Nine Degree Channel.", isTrue: false, explanation: "They are separated by the Ten Degree Channel. The Nine Degree Channel separates Lakshadweep from Minicoy." },
            { statement: "Kanchenjunga is the highest mountain peak located entirely within India.", isTrue: false, explanation: "Nanda Devi is the highest peak situated entirely within India. Kanchenjunga is on the border of India (Sikkim) and Nepal." },
            { statement: "Alluvial soils are the most widespread soil type in India.", isTrue: true, explanation: "They cover about 43% of the total land area, mainly in the northern plains and river valleys." },
            { statement: "The Luni is a west-flowing river that drains into the Arabian Sea.", isTrue: false, explanation: "The Luni is an ephemeral river that drains into the Rann of Kutch, not directly into the sea." }
        ];

        // --- GLOBAL STATE ---
        let globalScore = 0;
        let currentGameScore = 0;
        let currentActiveGame = null;

        // --- UTILITY FUNCTIONS ---
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function showModal(title, message, type, onContinue = null) {
            const modal = document.getElementById('custom-modal');
            const modalContent = document.getElementById('modal-content');
            const titleEl = document.getElementById('modal-title');
            const messageEl = document.getElementById('modal-message');
            const iconEl = document.getElementById('modal-icon');
            const btnEl = document.getElementById('modal-btn');

            titleEl.textContent = title;
            messageEl.innerHTML = message;

            if (type === 'success') {
                iconEl.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i>';
                iconEl.className = 'text-4xl mb-4 mx-auto w-16 h-16 flex items-center justify-center rounded-full bg-emerald-500/20';
                btnEl.className = 'w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition-colors';
            } else if (type === 'error') {
                iconEl.innerHTML = '<i class="fa-solid fa-xmark text-red-400"></i>';
                iconEl.className = 'text-4xl mb-4 mx-auto w-16 h-16 flex items-center justify-center rounded-full bg-red-500/20';
                btnEl.className = 'w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition-colors';
            } else {
                iconEl.innerHTML = '<i class="fa-solid fa-info text-emerald-400"></i>';
                iconEl.className = 'text-4xl mb-4 mx-auto w-16 h-16 flex items-center justify-center rounded-full bg-emerald-500/20';
                btnEl.className = 'w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-3 rounded-xl transition-colors';
            }

            modal.classList.remove('hidden');
            // Trigger animation
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            // Store callback
            modal.dataset.onContinue = onContinue ? onContinue.toString() : '';
            window.modalCallback = onContinue;
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const modalContent = document.getElementById('modal-content');
            
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                if (window.modalCallback) {
                    window.modalCallback();
                    window.modalCallback = null;
                }
            }, 300);
        }

        function updateGlobalScore(points) {
            globalScore += points;
            const scoreEl = document.getElementById('global-score');
            scoreEl.textContent = globalScore;
            
            // Animate score change
            scoreEl.classList.add('text-emerald-400', 'scale-125');
            setTimeout(() => {
                scoreEl.classList.remove('text-emerald-400', 'scale-125');
            }, 300);
        }

        function updateGameScore(points) {
            currentGameScore += points;
            document.getElementById('game-score-tracker').textContent = `Score: ${currentGameScore}`;
        }

        function switchView(viewId) {
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function returnToMenu() {
            switchView('menu-view');
            currentActiveGame = null;
            document.getElementById('game-canvas').innerHTML = '';
        }

        function startGame(gameType) {
            currentActiveGame = gameType;
            currentGameScore = 0;
            updateGameScore(0);
            switchView('game-view');
            
            const canvas = document.getElementById('game-canvas');
            canvas.innerHTML = ''; // Clear previous
            
            if (gameType === 'mapMaster') {
                document.getElementById('game-title').textContent = "Map Master: States";
                initMapMasterGame();
            } else if (gameType === 'riverSystem') {
                document.getElementById('game-title').textContent = "River Systems";
                initRiverSystemGame();
            } else if (gameType === 'factCheck') {
                document.getElementById('game-title').textContent = "Geo Fact Check";
                initFactCheckGame();
            }
        }

        // --- GAME 1: MAP MASTER ---
        let mapTargetState = null;
        let mapRemainingStates = [];
        let mapStatesFound = 0;

        function initMapMasterGame() {
            const canvas = document.getElementById('game-canvas');
            mapRemainingStates = shuffleArray([...mapData]).slice(0, 5); // Pick 5 for a round
            mapStatesFound = 0;
            setNextMapTarget();

            let svgContent = '';
            mapData.forEach(region => {
                svgContent += `<path id="region-${region.id}" class="map-region" d="${region.shape}" onclick="handleMapClick('${region.id}')"></path>`;
            });

            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col items-center h-full fade-in">
                    <p class="text-slate-400 mb-2">Locate the following state/region:</p>
                    <h3 class="text-3xl font-bold text-white mb-6" id="map-target-display">Loading...</h3>
                    
                    <!-- Abstract Map Representation -->
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 w-full flex justify-center mb-6">
                        <svg viewBox="0 0 150 200" class="w-full max-w-xs h-auto" id="india-map-svg">
                            <!-- In a real scenario, use an actual SVG map of India -->
                            <rect width="150" height="200" fill="none" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
                            ${svgContent}
                        </svg>
                    </div>

                    <div class="mt-4 flex justify-center hidden" id="map-next-btn-container">
                        <button onclick="initMapMasterGame()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-2 px-6 rounded-full transition-colors pulse-glow">
                            Next Round <i class="fa-solid fa-forward ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
            updateMapTargetDisplay();
        }

        function setNextMapTarget() {
            if (mapRemainingStates.length > 0) {
                mapTargetState = mapRemainingStates.pop();
            } else {
                mapTargetState = null;
            }
        }

        function updateMapTargetDisplay() {
            const display = document.getElementById('map-target-display');
            if (mapTargetState) {
                display.textContent = mapTargetState.name;
            } else {
                display.textContent = "Round Complete!";
                document.getElementById('map-next-btn-container').classList.remove('hidden');
                triggerConfetti();
                updateGlobalScore(50); // Bonus
                showModal("Excellent!", "You've located all areas correctly. +50 Bonus XP", "success");
            }
        }

        function handleMapClick(regionId) {
            if (!mapTargetState) return;

            const path = document.getElementById(`region-${regionId}`);
            
            // Check if already correct
            if (path.classList.contains('correct')) return;

            if (regionId === mapTargetState.id) {
                // Correct
                path.classList.add('correct');
                updateGameScore(20);
                updateGlobalScore(20);
                mapStatesFound++;
                
                // Slight delay before next target
                setTimeout(() => {
                    setNextMapTarget();
                    updateMapTargetDisplay();
                }, 500);

            } else {
                // Incorrect
                path.classList.add('incorrect', 'shake');
                updateGameScore(-5);
                setTimeout(() => {
                    path.classList.remove('incorrect', 'shake');
                }, 500);
            }
        }

        // --- GAME 2: RIVER SYSTEMS (Matching Tributaries) ---
        let currentRiverSet = [];
        let riverLeftSelected = null;
        let riverRightSelected = null;
        let riverMatchesFound = 0;

        function initRiverSystemGame() {
            const canvas = document.getElementById('game-canvas');
            riverMatchesFound = 0;
            riverLeftSelected = null;
            riverRightSelected = null;

            canvas.innerHTML = `
                <div class="w-full max-w-4xl flex flex-col h-full fade-in">
                    <p class="text-center text-slate-400 mb-6">Match the Tributary (Left) to its Main River (Right).</p>
                    
                    <div class="grid grid-cols-2 gap-4 md:gap-12 relative" id="river-container">
                        <!-- Left Column (Tributaries) -->
                        <div class="flex flex-col gap-3" id="river-left-col"></div>
                        
                        <!-- Middle connector visual (desktop only) -->
                        <div class="hidden md:flex absolute inset-y-0 left-1/2 transform -translate-x-1/2 flex-col justify-center">
                            <div class="h-full w-px bg-slate-700"></div>
                        </div>

                        <!-- Right Column (Main Rivers) -->
                        <div class="flex flex-col gap-3" id="river-right-col"></div>
                    </div>

                    <div class="mt-8 flex justify-center hidden" id="river-next-btn-container">
                        <button onclick="initRiverSystemGame()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-2 px-6 rounded-full transition-colors pulse-glow">
                            Play Again <i class="fa-solid fa-rotate-right ml-2"></i>
                        </button>
                    </div>
                </div>
            `;

            // Select 5 random pairs
            const shuffledFull = shuffleArray([...riverData]);
            currentRiverSet = shuffledFull.slice(0, 5);

            // Separate and shuffle left and right arrays independently
            const leftItems = shuffleArray(currentRiverSet.map((item, index) => ({ text: item.tributary, id: index, side: 'left' })));
            
            // For the right side (Main rivers), we need unique names, but multiple tributaries can belong to same river.
            // In this specific dataset, let's keep it simple and just match the specific pairs we pulled.
            const rightItems = shuffleArray(currentRiverSet.map((item, index) => ({ text: item.main, id: index, side: 'right' })));

            renderRiverList('river-left-col', leftItems);
            renderRiverList('river-right-col', rightItems);
        }

        function renderRiverList(containerId, items) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-3 md:px-6 md:py-4 rounded-xl border-2 border-slate-700 transition-all text-sm md:text-base font-medium shadow-sm';
                btn.textContent = item.text;
                btn.dataset.id = item.id;
                btn.dataset.side = item.side;
                btn.onclick = () => handleRiverSelection(item, btn);
                container.appendChild(btn);
            });
        }

        function handleRiverSelection(item, btnElement) {
            if (btnElement.classList.contains('matched')) return;

            if (item.side === 'left') {
                if (riverLeftSelected) riverLeftSelected.element.classList.remove('border-emerald-400', 'bg-emerald-500/10');
                riverLeftSelected = { data: item, element: btnElement };
                btnElement.classList.add('border-emerald-400', 'bg-emerald-500/10');
            } else {
                if (riverRightSelected) riverRightSelected.element.classList.remove('border-emerald-400', 'bg-emerald-500/10');
                riverRightSelected = { data: item, element: btnElement };
                btnElement.classList.add('border-emerald-400', 'bg-emerald-500/10');
            }

            if (riverLeftSelected && riverRightSelected) {
                checkRiverMatch();
            }
        }

        function checkRiverMatch() {
            const left = riverLeftSelected;
            const right = riverRightSelected;
            
            if (left.data.id === right.data.id) {
                // Correct
                left.element.classList.remove('border-emerald-400', 'bg-emerald-500/10');
                right.element.classList.remove('border-emerald-400', 'bg-emerald-500/10');
                
                left.element.classList.add('matched', 'bg-cyan-500/20', 'border-cyan-500', 'text-cyan-100', 'opacity-50', 'cursor-default');
                right.element.classList.add('matched', 'bg-cyan-500/20', 'border-cyan-500', 'text-cyan-100', 'opacity-50', 'cursor-default');
                
                left.element.innerHTML = `<i class="fa-solid fa-water text-cyan-400 mr-2"></i> ${left.data.text}`;
                right.element.innerHTML = `<i class="fa-solid fa-water text-cyan-400 mr-2"></i> ${right.data.text}`;

                updateGameScore(20);
                updateGlobalScore(20);
                riverMatchesFound++;

                if (riverMatchesFound === 5) {
                    triggerConfetti();
                    updateGlobalScore(50); // completion bonus
                    document.getElementById('river-next-btn-container').classList.remove('hidden');
                    showModal("Flowing smoothly!", "All tributaries matched successfully. +50 Bonus XP!", "success");
                }
            } else {
                // Incorrect
                left.element.classList.remove('border-emerald-400', 'bg-emerald-500/10');
                right.element.classList.remove('border-emerald-400', 'bg-emerald-500/10');
                
                left.element.classList.add('shake', 'bg-red-500/20', 'border-red-500');
                right.element.classList.add('shake', 'bg-red-500/20', 'border-red-500');
                
                setTimeout(() => {
                    left.element.classList.remove('shake', 'bg-red-500/20', 'border-red-500');
                    right.element.classList.remove('shake', 'bg-red-500/20', 'border-red-500');
                }, 500);

                updateGameScore(-5);
            }

            riverLeftSelected = null;
            riverRightSelected = null;
        }

        // --- GAME 3: GEO FACT CHECK (True/False) ---
        let currentFactSet = [];
        let currentFactIndex = 0;

        function initFactCheckGame() {
            const canvas = document.getElementById('game-canvas');
            
            // Get 5 random facts
            currentFactSet = shuffleArray([...geoFactsData]).slice(0, 5);
            currentFactIndex = 0;

            canvas.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col h-full fade-in items-center">
                    <div class="flex justify-between items-center w-full mb-6 text-sm text-slate-400 font-medium">
                        <span>Question <span id="fact-current-num">1</span> of 5</span>
                        <span>True or False</span>
                    </div>

                    <div class="bg-slate-800 rounded-2xl p-8 mb-8 border border-slate-700 shadow-lg w-full min-h-[160px] flex items-center justify-center text-center relative overflow-hidden" id="fact-card">
                        <div class="absolute top-0 right-0 p-4 text-slate-600 opacity-20">
                            <i class="fa-solid fa-quote-right text-6xl"></i>
                        </div>
                        <p class="text-xl md:text-2xl text-slate-100 font-semibold relative z-10" id="fact-statement">Loading...</p>
                    </div>

                    <div class="grid grid-cols-2 gap-6 w-full max-w-md" id="fact-controls">
                        <button onclick="handleFactAnswer(true)" class="bg-emerald-500/20 hover:bg-emerald-500 text-emerald-400 hover:text-white border border-emerald-500/50 hover:border-emerald-500 font-bold py-4 px-6 rounded-xl transition-all shadow-md text-lg">
                            <i class="fa-solid fa-check mr-2"></i> TRUE
                        </button>
                        <button onclick="handleFactAnswer(false)" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/50 hover:border-red-500 font-bold py-4 px-6 rounded-xl transition-all shadow-md text-lg">
                            <i class="fa-solid fa-xmark mr-2"></i> FALSE
                        </button>
                    </div>

                    <div class="mt-8 flex justify-center hidden w-full" id="fact-next-btn-container">
                        <button onclick="initFactCheckGame()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-3 px-8 rounded-full transition-colors pulse-glow w-full max-w-md text-lg">
                            Play Another Round
                        </button>
                    </div>
                </div>
            `;
            
            displayCurrentFact();
        }

        function displayCurrentFact() {
            if (currentFactIndex < currentFactSet.length) {
                const fact = currentFactSet[currentFactIndex];
                const statementEl = document.getElementById('fact-statement');
                const cardEl = document.getElementById('fact-card');
                
                // Animate entry
                cardEl.classList.remove('fade-in');
                void cardEl.offsetWidth; // trigger reflow
                cardEl.classList.add('fade-in');
                
                statementEl.textContent = fact.statement;
                document.getElementById('fact-current-num').textContent = currentFactIndex + 1;
            } else {
                // Round Complete
                document.getElementById('fact-card').innerHTML = `<p class="text-2xl text-emerald-400 font-bold">Round Complete!</p>`;
                document.getElementById('fact-controls').classList.add('hidden');
                document.getElementById('fact-next-btn-container').classList.remove('hidden');
                triggerConfetti();
                updateGlobalScore(30);
            }
        }

        function handleFactAnswer(userAnswer) {
            const fact = currentFactSet[currentFactIndex];
            
            if (userAnswer === fact.isTrue) {
                // Correct
                updateGameScore(20);
                updateGlobalScore(20);
                showModal("Correct!", fact.explanation, "success", () => {
                    currentFactIndex++;
                    displayCurrentFact();
                });
            } else {
                // Incorrect
                updateGameScore(-10);
                showModal("Incorrect", fact.explanation, "error", () => {
                    currentFactIndex++;
                    displayCurrentFact();
                });
            }
        }


        // --- VISUAL EFFECTS (CONFETTI) ---
        let particles = [];
        const colors = ['#10b981', '#34d399', '#059669', '#3b82f6', '#fcd34d', '#ffffff'];

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            
            animateConfetti();
        }

        function animateConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let activeParticles = 0;
            
            particles.forEach((p, index) => {
                if (p.y <= canvas.height) {
                    activeParticles++;
                    p.tiltAngle += p.tiltAngleInc;
                    p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle) * 2;
                    p.dy += 0.5; // gravity
                    p.x += p.dx;
                    p.y += p.dy;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                }
            });
            
            // Clean up off-screen particles
            particles = particles.filter(p => p.y <= canvas.height);

            if (activeParticles > 0) {
                requestAnimationFrame(animateConfetti);
            }
        }

        // Handle window resize for canvas
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            if(canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });

        // Initialize state on load
        window.onload = () => {
            switchView('menu-view');
        };

    </script>
</body>
</html>
